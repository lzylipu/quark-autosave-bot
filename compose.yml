name: quark-autosave-bot

services:
  bot:
    image: lzylipu/quarkbot:latest
    container_name: quarkbot
    environment:
      PORT: 8080
      SUPERUSER: "${SUPERUSER}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      QAS_ENDPOINT: "${QAS_ENDPOINT:-http://quark-auto-save:5005}"
      # QASx 的 api_token（登录 WebUI 后访问 /data 复制 api_token 字段）
      QAS_TOKEN: "${QAS_TOKEN}"
      SIMPLE_SAVE_ROOT: "${SIMPLE_SAVE_ROOT:-自动}"
      # 单次转存整体超时（秒）
      QAS_RUN_TIMEOUT: "${QAS_RUN_TIMEOUT:-1800}"
      # 同一链接多少秒内重复发送时直接返回上次结果
      DEDUPE_SECONDS: "${DEDUPE_SECONDS:-600}"
      ASK_PASSCODE: "${ASK_PASSCODE:-true}"
      # ===== 追剧订阅 =====
      # 每天几点跑订阅（HH:MM，容器时区）
      SUB_CHECK_TIME: "${SUB_CHECK_TIME:-17:00}"
      # 每集大小区间（GB）
      SUB_MIN_SIZE_GB: "${SUB_MIN_SIZE_GB:-1.5}"
      SUB_MAX_SIZE_GB: "${SUB_MAX_SIZE_GB:-8.0}"
      # 每个订阅最多检查多少个搜索结果（0 = 搜到多少看多少）
      SUB_MAX_CANDIDATES: "${SUB_MAX_CANDIDATES:-0}"
      # 凑够这么多个合格分享就停止继续扫（0 = 不提前停）
      SUB_MAX_OK_CANDIDATES: "${SUB_MAX_OK_CANDIDATES:-1}"
      # 全都不在区间内时退一档的下限（每集中位数 GB，挡枪版）
      SUB_FALLBACK_MIN_SIZE_GB: "${SUB_FALLBACK_MIN_SIZE_GB:-0.5}"
    volumes:
      # 订阅列表持久化，重建容器不丢
      - bot-data:/app/data
    restart: unless-stopped
    depends_on: [quark-auto-save]
    networks: [quark-net]

  quark-auto-save:
    image: cp0204/quark-auto-save:latest
    container_name: quark-auto-save
    ports:
      # 只绑本机，避免把 QAS WebUI 暴露到局域网
      - "127.0.0.1:5005:5005"
    volumes:
      - qas-config:/config
      - qas-downloads:/downloads
    restart: unless-stopped
    networks: [quark-net]

networks:
  quark-net:

volumes:
  bot-data:
  qas-config:
  qas-downloads:
