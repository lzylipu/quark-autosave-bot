name: quark-autosave-bot

services:
  bot:
    image: lzylipu/quarkbot:latest
    container_name: quarkbot
    environment:
      PORT: 8080
      SUPERUSER: "${SUPERUSER}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      QAS_ENDPOINT: "${QAS_ENDPOINT:-http://quark-auto-save:5005}"
      QAS_TOKEN: "${QAS_TOKEN}"
      SIMPLE_SAVE_ROOT: "${SIMPLE_SAVE_ROOT:-auto}"
    restart: unless-stopped
    depends_on: [quark-auto-save]
    networks: [quark-net]

  quark-auto-save:
    image: cp0204/quark-auto-save:latest
    container_name: quark-auto-save
    ports:
      - "5005:5005"
    volumes:
      - qas-config:/config
      - qas-downloads:/downloads
    environment:
      QAS_TOKEN: "${QAS_TOKEN}"
    restart: unless-stopped
    networks: [quark-net]

networks:
  quark-net:

volumes:
  qas-config:
  qas-downloads:
